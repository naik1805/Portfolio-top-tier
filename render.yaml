services:
  - type: web
    name: mohith-naik-portfolio
    runtime: static
    repo: https://github.com/naik1805/Portfolio-top-tier
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
